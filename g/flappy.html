<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Untitled document - Google Docs</title>
<link rel="icon" href="../assets/doc.svg"><link rel="stylesheet" href="../assets/play.css">
</head><body>
<div class="hud"><a href="../">←</a><span id="ttl">pipes</span><span class="sp"></span><span id="hint">click / space</span><span id="sc">0</span></div>
<div class="stage"><canvas id="c"></canvas></div>
<script>
const W=400,H=600,cv=document.getElementById('c'),ctx=cv.getContext('2d');
cv.width=W;cv.height=H;
const scEl=document.getElementById('sc');
let y,vy,pipes,score,dead,spawn,best=+(localStorage.flp||0);
const GAP=150,PW=62,SPD=2.5;
function reset(){y=H/2;vy=0;pipes=[];score=0;dead=false;spawn=0;scEl.textContent='0'}
function flap(){if(dead){reset();return}vy=-6.2}
addEventListener('keydown',e=>{if(e.key===' '||e.key==='ArrowUp'){e.preventDefault();flap()}});
cv.addEventListener('pointerdown',e=>{e.preventDefault();flap()});
function tick(){
 if(dead)return;
 vy+=.34;y+=vy;
 if(spawn--<=0){pipes.push({x:W,top:60+Math.random()*(H-GAP-180)});spawn=92}
 for(const p of pipes)p.x-=SPD;
 pipes=pipes.filter(p=>{if(!p.scored&&p.x+PW<70){p.scored=true;score++;scEl.textContent=score}return p.x>-PW});
 const r=18;
 for(const p of pipes){
  if(70+r>p.x&&70-r<p.x+PW&&(y-r<p.top||y+r>p.top+GAP)){dead=true;
   if(score>best){best=score;localStorage.flp=best}}}
 if(y>H-r||y<r){dead=true;if(score>best){best=score;localStorage.flp=best}}
}
function draw(){
 const sky=ctx.createLinearGradient(0,0,0,H);
 sky.addColorStop(0,'#101a24');sky.addColorStop(1,'#0a0b0d');
 ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 for(const p of pipes){
  ctx.fillStyle='#3c6b2f';ctx.fillRect(p.x,0,PW,p.top);
  ctx.fillRect(p.x,p.top+GAP,PW,H-p.top-GAP);
  ctx.fillStyle='#c9f24e';ctx.fillRect(p.x-3,p.top-16,PW+6,16);
  ctx.fillRect(p.x-3,p.top+GAP,PW+6,16)}
 ctx.fillStyle='#c9f24e';ctx.beginPath();ctx.arc(70,y,18,0,7);ctx.fill();
 ctx.fillStyle='#0a0b0d';ctx.beginPath();ctx.arc(77,y-5,4,0,7);ctx.fill();
 if(dead){ctx.fillStyle='rgba(0,0,0,.74)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';ctx.fillStyle='#e9e9e4';ctx.font='bold 22px ui-monospace,monospace';
  ctx.fillText('GAME OVER',W/2,H/2-14);ctx.fillStyle='#868c93';ctx.font='12px ui-monospace,monospace';
  ctx.fillText('score '+score+' · best '+best,W/2,H/2+12);ctx.fillText('click to restart',W/2,H/2+36)}
}
(function l(){tick();draw();requestAnimationFrame(l)})();
reset();
</script></body></html>
