<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Untitled document - Google Docs</title>
<link rel="icon" href="../assets/doc.svg"><link rel="stylesheet" href="../assets/play.css">
</head><body>
<div class="hud"><a href="../">←</a><span id="ttl">snake</span><span class="sp"></span><span id="hint">arrows / swipe</span><span id="sc">0</span></div>
<div class="stage"><canvas id="c"></canvas></div>
<script>
const N=20,S=24,cv=document.getElementById('c'),ctx=cv.getContext('2d');
cv.width=cv.height=N*S;
const scEl=document.getElementById('sc');
let sn,dir,nd,food,score,dead,acc,last,step,hi=+(localStorage.snk||0);
function place(){do{food={x:Math.random()*N|0,y:Math.random()*N|0}}while(sn.some(s=>s.x===food.x&&s.y===food.y))}
function reset(){sn=[{x:8,y:10},{x:7,y:10},{x:6,y:10}];dir={x:1,y:0};nd=null;score=0;dead=false;acc=0;last=0;step=130;scEl.textContent='0';place()}
function step1(){if(nd){dir=nd;nd=null}
 const h={x:sn[0].x+dir.x,y:sn[0].y+dir.y};
 if(h.x<0||h.y<0||h.x>=N||h.y>=N||sn.some(s=>s.x===h.x&&s.y===h.y)){dead=true;if(score>hi){hi=score;localStorage.snk=hi}return}
 sn.unshift(h);
 if(h.x===food.x&&h.y===food.y){score++;scEl.textContent=score;step=Math.max(62,step-3);place()}else sn.pop()}
function draw(){
 ctx.fillStyle='#0a0b0d';ctx.fillRect(0,0,cv.width,cv.height);
 ctx.fillStyle='#161a1f';for(let i=0;i<N;i++)for(let j=0;j<N;j++)if((i+j)&1)ctx.fillRect(i*S,j*S,S,S);
 ctx.fillStyle='#ffb03a';ctx.fillRect(food.x*S+4,food.y*S+4,S-8,S-8);
 sn.forEach((s,i)=>{ctx.fillStyle=i?'#7fae2e':'#c9f24e';ctx.fillRect(s.x*S+1,s.y*S+1,S-2,S-2)});
 if(dead){ctx.fillStyle='rgba(0,0,0,.74)';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.textAlign='center';ctx.fillStyle='#e9e9e4';ctx.font='bold 21px ui-monospace,monospace';
  ctx.fillText('GAME OVER',cv.width/2,cv.height/2-10);
  ctx.fillStyle='#868c93';ctx.font='12px ui-monospace,monospace';
  ctx.fillText('score '+score+' · best '+hi,cv.width/2,cv.height/2+16);
  ctx.fillText('space to restart',cv.width/2,cv.height/2+40)}}
function loop(t){if(!last)last=t;acc+=t-last;last=t;if(!dead&&acc>=step){acc=0;step1()}draw();requestAnimationFrame(loop)}
addEventListener('keydown',e=>{if(dead&&e.key===' '){reset();return}
 const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]}[e.key];
 if(m){e.preventDefault();if(!(m[0]===-dir.x&&m[1]===-dir.y))nd={x:m[0],y:m[1]}}});
let tx,ty;
addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
 if(Math.abs(dx)<18&&Math.abs(dy)<18)return;
 const m=Math.abs(dx)>Math.abs(dy)?[Math.sign(dx),0]:[0,Math.sign(dy)];
 if(!(m[0]===-dir.x&&m[1]===-dir.y))nd={x:m[0],y:m[1]}},{passive:true});
reset();requestAnimationFrame(loop);
</script></body></html>
