<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Untitled document - Google Docs</title>
<link rel="icon" href="../assets/doc.svg"><link rel="stylesheet" href="../assets/play.css">
</head><body>
<div class="hud"><a href="../">←</a><span id="ttl">four</span><span class="sp"></span><span id="hint">click a column</span><span id="sc">you 0 · cpu 0</span></div>
<div class="stage"><canvas id="c"></canvas></div>
<script>
const C=7,R=6,S=62,cv=document.getElementById('c'),ctx=cv.getContext('2d');
cv.width=C*S;cv.height=R*S;
const scEl=document.getElementById('sc');
let g,turn,over,res,you=0,cpu=0,hov=-1;
function reset(){g=Array.from({length:R},()=>Array(C).fill(0));turn=1;over=false;res='';scEl.textContent='you '+you+' · cpu '+cpu}
function drop(c,p){for(let r=R-1;r>=0;r--)if(!g[r][c]){g[r][c]=p;return r}return -1}
function wins(p){
 const dirs=[[1,0],[0,1],[1,1],[1,-1]];
 for(let r=0;r<R;r++)for(let c=0;c<C;c++)for(const [dx,dy] of dirs){
  let n=0;for(let k=0;k<4;k++){const r2=r+dy*k,c2=c+dx*k;
   if(r2<0||r2>=R||c2<0||c2>=C||g[r2][c2]!==p)break;n++}
  if(n===4)return true}
 return false}
function full(){return g[0].every(Boolean)}
function evalB(p){
 let s=0;const dirs=[[1,0],[0,1],[1,1],[1,-1]];
 for(let r=0;r<R;r++)for(let c=0;c<C;c++)for(const [dx,dy] of dirs){
  let n=0,ok=true;
  for(let k=0;k<4;k++){const r2=r+dy*k,c2=c+dx*k;
   if(r2<0||r2>=R||c2<0||c2>=C){ok=false;break}
   if(g[r2][c2]===p)n++;else if(g[r2][c2])ok=false}
  if(ok)s+=n===4?1e4:n===3?60:n===2?8:n}
 return s}
function best(){
 let bv=-1e9,bc=3;
 for(let c=0;c<C;c++){
  if(g[0][c])continue;
  const r=drop(c,2);
  let v=evalB(2)*1.2-evalB(1);
  if(wins(2))v+=1e6;
  g[r][c]=0;
  const mid=3-Math.abs(3-c);v+=mid*6;
  if(v>bv){bv=v;bc=c}}
 return bc}
function place(c,p){
 const r=drop(c,p);if(r<0)return false;
 if(wins(p)){over=true;res=p===1?'you win':'cpu wins';if(p===1)you++;else cpu++}
 else if(full()){over=true;res='draw'}
 scEl.textContent='you '+you+' · cpu '+cpu;
 return true}
cv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect();hov=Math.floor((e.clientX-r.left)/(r.width/C))});
cv.addEventListener('mouseleave',()=>hov=-1);
cv.addEventListener('click',e=>{
 if(over){reset();return}
 const r=cv.getBoundingClientRect();const c=Math.floor((e.clientX-r.left)/(r.width/C));
 if(c<0||c>=C||turn!==1)return;
 if(!place(c,1))return;turn=2;
 if(!over)setTimeout(()=>{place(best(),2);turn=1},230)});
function draw(){
 ctx.fillStyle='#0a0b0d';ctx.fillRect(0,0,cv.width,cv.height);
 for(let r=0;r<R;r++)for(let c=0;c<C;c++){
  const X=c*S+S/2,Y=r*S+S/2;
  ctx.fillStyle='#171a1e';ctx.beginPath();ctx.arc(X,Y,S*.4,0,7);ctx.fill();
  if(c===hov&&!over&&turn===1&&!g[0][c]){ctx.fillStyle='rgba(201,242,78,.16)';
   ctx.beginPath();ctx.arc(X,Y,S*.4,0,7);ctx.fill()}
  if(g[r][c]){ctx.fillStyle=g[r][c]===1?'#c9f24e':'#ff7a7a';
   ctx.beginPath();ctx.arc(X,Y,S*.36,0,7);ctx.fill()}}
 if(over){ctx.fillStyle='rgba(0,0,0,.74)';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.textAlign='center';ctx.fillStyle='#e9e9e4';ctx.font='bold 18px ui-monospace,monospace';
  ctx.fillText(res.toUpperCase(),cv.width/2,cv.height/2-6);
  ctx.fillStyle='#868c93';ctx.font='12px ui-monospace,monospace';
  ctx.fillText('click to restart',cv.width/2,cv.height/2+20)}}
reset();(function l(){draw();requestAnimationFrame(l)})();
</script></body></html>
