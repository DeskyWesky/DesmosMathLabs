<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Untitled document - Google Docs</title>
<link rel="icon" href="../assets/doc.svg"><link rel="stylesheet" href="../assets/play.css">
</head><body>
<div class="hud"><a href="../">←</a><span id="ttl">breakout</span><span class="sp"></span><span id="hint">mouse / arrows</span><span id="sc">0</span></div>
<div class="stage"><canvas id="c"></canvas></div>
<script>
const W=480,H=560,cv=document.getElementById('c'),ctx=cv.getContext('2d');
cv.width=W;cv.height=H;
const scEl=document.getElementById('sc');
const COLS=8,ROWS=5,BW=W/COLS-6,BH=18,TOP=70;
let px,pw=78,balls,bricks,score,lives,over,win;
function reset(){px=W/2;pw=78;balls=[{x:W/2,y:H-70,vx:2.6,vy:-4.2,r:6}];
 bricks=[];for(let r=0;r<ROWS;r++)for(let k=0;k<COLS;k++)bricks.push({x:6+k*(BW+6),y:TOP+r*(BH+6),hp:1+((r>2)?1:0)});
 score=0;lives=3;over=false;win=false;scEl.textContent='0'}
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')px-=38;if(e.key==='ArrowRight')px+=38;
 if(e.key===' '&&over)reset()});
cv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect();px=(e.clientX-r.left)*(W/r.width)});
cv.addEventListener('touchmove',e=>{const r=cv.getBoundingClientRect();px=(e.touches[0].clientX-r.left)*(W/r.width);e.preventDefault()},{passive:false});
function tick(){
 if(over)return;
 px=Math.max(pw/2,Math.min(W-pw/2,px));
 for(const b of balls){
  b.x+=b.vx;b.y+=b.vy;
  if(b.x<b.r){b.x=b.r;b.vx*=-1}
  if(b.x>W-b.r){b.x=W-b.r;b.vx*=-1}
  if(b.y<b.r){b.y=b.r;b.vy*=-1}
  if(b.y>H-40&&b.y<H-24&&b.x>px-pw/2&&b.x<px+pw/2&&b.vy>0){
   b.vy=-Math.abs(b.vy);b.vx=(b.x-px)/pw*5.4;b.vy*=.99}
  for(const k of bricks){
   if(k.hp>0&&b.x>k.x-b.r&&b.x<k.x+BW+b.r&&b.y>k.y-b.r&&b.y<k.y+BH+b.r){
    k.hp--;b.vy*=-1;score+=10;scEl.textContent=score;break}}
  if(b.y>H+20){lives--;if(lives<=0){over=true;win=false}
   else{b.x=W/2;b.y=H-70;b.vx=2.6*(Math.random()<.5?-1:1);b.vy=-4.2}}
 }
 bricks=bricks.filter(k=>k.hp>0);
 if(!bricks.length){over=true;win=true}
}
function draw(){
 ctx.fillStyle='#0a0b0d';ctx.fillRect(0,0,W,H);
 for(const k of bricks){
  ctx.fillStyle=k.hp>1?'#7fae2e':'#c9f24e';
  ctx.fillRect(k.x,k.y,BW,BH);
  ctx.fillStyle='rgba(0,0,0,.18)';ctx.fillRect(k.x,k.y+BH-4,BW,4)}
 ctx.fillStyle='#e9e9e4';ctx.fillRect(px-pw/2,H-38,pw,9);
 ctx.fillStyle='#c9f24e';for(const b of balls){ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill()}
 ctx.fillStyle='#868c93';ctx.font='11px ui-monospace,monospace';ctx.textAlign='left';
 ctx.fillText('lives '+lives,12,26);
 if(over){ctx.fillStyle='rgba(0,0,0,.74)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';ctx.fillStyle='#e9e9e4';ctx.font='bold 21px ui-monospace,monospace';
  ctx.fillText(win?'CLEARED':'GAME OVER',W/2,H/2-8);
  ctx.fillStyle='#868c93';ctx.font='12px ui-monospace,monospace';
  ctx.fillText('score '+score,W/2,H/2+18);ctx.fillText('space to restart',W/2,H/2+42)}
}
(function loop(){tick();draw();requestAnimationFrame(loop)})();
reset();
</script></body></html>
