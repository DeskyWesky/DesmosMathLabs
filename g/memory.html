<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Untitled document - Google Docs</title>
<link rel="icon" href="../assets/doc.svg"><link rel="stylesheet" href="../assets/play.css">
<style>
#b{display:grid;grid-template-columns:repeat(4,78px);gap:8px}
.c{aspect-ratio:1;display:grid;place-items:center;background:#1b2026;border:1px solid #2b323a;
 font-size:27px;color:transparent;cursor:pointer;border-radius:2px;transition:.12s}
.c:hover{border-color:#c9f24e}
.c.up{background:#242b33;color:#c9f24e}
.c.done{background:#22300f;color:#7fae2e;border-color:#3d5320}
</style></head><body>
<div class="hud"><a href="../">←</a><span id="ttl">pairs</span><span class="sp"></span><span id="hint">find the matches</span><span id="sc">0 moves</span></div>
<div class="stage"><div id="b"></div></div>
<script>
const G=['✦','◈','▲','●','■','◑','✚','◆'];
const b=document.getElementById('b'),scEl=document.getElementById('sc');
let deck,open,moves,done,lock;
function reset(){deck=[...G,...G].sort(()=>Math.random()-.5);
 open=[];moves=0;done=0;lock=false;scEl.textContent='0 moves';b.innerHTML='';
 deck.forEach((s,i)=>{const d=document.createElement('div');d.className='c';d.dataset.i=i;
  d.textContent=s;d.addEventListener('click',()=>flip(i,d));b.appendChild(d)})}
function flip(i,d){
 if(lock||d.classList.contains('up')||d.classList.contains('done'))return;
 d.classList.add('up');open.push([i,d]);
 if(open.length<2)return;
 moves++;scEl.textContent=moves+' moves';lock=true;
 const [a,ad]=open[0],[bb,bd]=open[1];
 if(deck[a]===deck[bb]){
  ad.classList.add('done');bd.classList.add('done');open=[];lock=false;done++;
  if(done===G.length)setTimeout(()=>{b.innerHTML='';const p=document.createElement('p');
   p.style.cssText='font:14px ui-monospace,monospace;color:#c9f24e;text-align:center';
   p.textContent='cleared in '+moves+' moves — click to replay';
   p.onclick=reset;document.querySelector('.stage').appendChild(p)},320)}
 else setTimeout(()=>{ad.classList.remove('up');bd.classList.remove('up');open=[];lock=false},620)}
reset();
</script></body></html>
