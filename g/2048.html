<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Untitled document - Google Docs</title>
<link rel="icon" href="../assets/doc.svg"><link rel="stylesheet" href="../assets/play.css">
</head><body>
<div class="hud"><a href="../">←</a><span id="ttl">2048</span><span class="sp"></span><span id="hint">arrows / swipe</span><span id="sc">0</span></div>
<div class="stage"><canvas id="c"></canvas></div>
<script>
const N=4,S=104,G=10,cv=document.getElementById('c'),ctx=cv.getContext('2d');
cv.width=cv.height=N*S+G*(N+1);
const scEl=document.getElementById('sc');
let g,score,over,won;
const COL={2:'#2a2f36',4:'#343a42',8:'#4a5a2a',16:'#65802c',32:'#82a231',64:'#a3c93a',128:'#c9f24e',256:'#d9ff62',512:'#ffd166',1024:'#ffb03a',2048:'#ff8f3a'};
function add(){const free=[];g.forEach((r,y)=>r.forEach((v,x)=>{if(!v)free.push([x,y])}));
 if(!free.length)return;const [x,y]=free[Math.random()*free.length|0];g[y][x]=Math.random()<.9?2:4}
function reset(){g=Array.from({length:N},()=>Array(N).fill(0));score=0;over=false;won=false;scEl.textContent='0';add();add()}
function slide(row){const a=row.filter(v=>v);for(let i=0;i<a.length-1;i++)if(a[i]===a[i+1]){a[i]*=2;score+=a[i];a.splice(i+1,1)}
 while(a.length<N)a.push(0);return a}
function move(dir){
 const before=JSON.stringify(g);
 if(dir==='l')g=g.map(r=>slide(r));
 if(dir==='r')g=g.map(r=>slide(r.slice().reverse()).reverse());
 if(dir==='u'||dir==='d'){
  for(let x=0;x<N;x++){let col=g.map(r=>r[x]);
   if(dir==='d')col=col.reverse();
   col=slide(col);if(dir==='d')col=col.reverse();
   col.forEach((v,y)=>g[y][x]=v)}}
 if(JSON.stringify(g)!==before){add();scEl.textContent=score;
  if(g.flat().includes(2048))won=true;
  if(!canMove())over=true}}
function canMove(){if(g.flat().includes(0))return true;
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){
  if(x<N-1&&g[y][x]===g[y][x+1])return true;
  if(y<N-1&&g[y][x]===g[y+1][x])return true}
 return false}
function draw(){
 ctx.fillStyle='#0a0b0d';ctx.fillRect(0,0,cv.width,cv.height);
 g.forEach((r,y)=>r.forEach((v,x)=>{
  const X=G+x*(S+G),Y=G+y*(S+G);
  ctx.fillStyle=v?COL[v]||'#e9e9e4':'#171a1e';ctx.fillRect(X,Y,S,S);
  if(v){ctx.fillStyle=v>4?'#0a0b0d':'#e9e9e4';
   ctx.font='bold '+(v>999?26:v>99?32:38)+'px ui-monospace,monospace';
   ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(v,X+S/2,Y+S/2+2)}}));
 if(over||won){ctx.fillStyle='rgba(0,0,0,.76)';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#e9e9e4';
  ctx.font='bold 26px ui-monospace,monospace';ctx.fillText(won?'2048':'GAME OVER',cv.width/2,cv.height/2-14);
  ctx.fillStyle='#868c93';ctx.font='12px ui-monospace,monospace';ctx.fillText('space to restart',cv.width/2,cv.height/2+22)}}
const K={ArrowLeft:'l',ArrowRight:'r',ArrowUp:'u',ArrowDown:'d',a:'l',d:'r',w:'u',s:'d'};
addEventListener('keydown',e=>{
 if(e.key===' '&&(over||won)){reset();return}
 const d=K[e.key];if(!d)return;e.preventDefault();move(d)});
let tx,ty;
addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
addEventListener('touchend',e=>{
 const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
 if(Math.abs(dx)<24&&Math.abs(dy)<24)return;
 move(Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u'))},{passive:true});
reset();(function l(){draw();requestAnimationFrame(l)})();
</script></body></html>
