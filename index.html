<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DesmosMathLabs</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>DesmosMathLabs</h1>
    <input id="search" type="search" placeholder="Search games...">
  </header>

  <main id="game-grid"></main>

  <div id="player" class="hidden" role="dialog" aria-modal="true">
    <div class="player-bar">
      <span id="player-title"></span>
      <button id="close" type="button">Close</button>
    </div>
    <iframe id="game-frame" title="Game"></iframe>
  </div>

  <script src="app.js"></script>
</body>
</html>
